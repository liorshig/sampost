[project]
name = "sampost"
version = "0.1.0"
description = "Lazy xarray diagnostics for System for Atmospheric Modeling output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask[array]>=2024.1",
    "metpy>=1.6",
    "netcdf4>=1.6",
    "numpy>=1.26",
    "scipy>=1.10",
    "xarray>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[dependency-groups]
docs = [
    "metpy>=1.6",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=3.0",
]

[tool.uv]
default-groups = ["docs"]

[project.scripts]
sampost-docs = "sampost._docs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sampost"]
